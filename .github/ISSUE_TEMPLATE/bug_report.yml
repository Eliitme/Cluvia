name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please never paste tokens, keys or kubeconfig secrets.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open cluster …
        2. Select …
        3. …
  - type: input
    id: cluvia
    attributes:
      label: Cluvia version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version and distribution
      placeholder: v1.31 on EKS / kind / k3s …
  - type: dropdown
    id: auth
    attributes:
      label: How the cluster authenticates
      options:
        - Client certificate
        - Token
        - Credential plugin (aws, gke-gcloud-auth-plugin, kubelogin, …)
        - Other / not sure
