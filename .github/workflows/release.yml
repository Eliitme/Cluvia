name: Release

# release-please keeps a "Release vX.Y.Z" pull request up to date from Conventional Commits on main (version in
# project.yml and CHANGELOG.md). Merging it tags the release and creates the GitHub Release; the build job then
# attaches the DMG. Run manually with a tag to (re)build the assets of an existing release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.1.0
        required: true

# Read-only by default; each job asks for the write access it needs.
permissions:
  contents: read

# One release run at a time; a queued run waits rather than cancelling a DMG build halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - name: Signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "No Developer ID certificate secret: building an ad-hoc signed, unnotarized DMG."
            echo "UNSIGNED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Notary key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          if [ "${UNSIGNED:-0}" = "1" ] || [ -z "$NOTARY_KEY" ]; then
            [ "${UNSIGNED:-0}" = "1" ] || echo "SKIP_NOTARIZE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build DMG
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-release.sh
      # The app checks releases/latest/download/appcast.xml for updates; each update must carry an EdDSA signature
      # from SPARKLE_PRIVATE_KEY. Without the key (or for an unsigned build) no appcast is published.
      - name: Sparkle appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_KEY" ] || [ "${UNSIGNED:-0}" = "1" ]; then echo "No Sparkle key or unsigned build: no appcast."; exit 0; fi
          VERSION=${TAG#v}
          DMG=build/release/Cluvia-$VERSION.dmg
          SPARKLE_BIN=build/release/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin
          SIGNATURE=$(printf '%s' "$SPARKLE_KEY" | "$SPARKLE_BIN/sign_update" --ed-key-file - -p "$DMG")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" build/release/export/Cluvia.app/Contents/Info.plist)
          scripts/make_appcast.py --version "$VERSION" --build "$BUILD" --dmg "$DMG" --ed-signature "$SIGNATURE" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Cluvia-$VERSION.dmg" > build/release/appcast.xml
          xmllint --noout build/release/appcast.xml
      - name: Attach to release
        run: |
          gh release upload "$TAG" build/release/Cluvia-*.dmg build/release/Cluvia-*.dmg.sha256 --clobber
          if [ -f build/release/appcast.xml ]; then gh release upload "$TAG" build/release/appcast.xml --clobber; fi
          case "$TAG" in *-*) gh release edit "$TAG" --prerelease ;; esac
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

  # Points the Homebrew cask (github.com/Eliitme/homebrew-tap) at the new release. Needs HOMEBREW_TAP_TOKEN, a
  # fine-grained token with Contents write access to that repository; skipped without it and for pre-releases.
  homebrew:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update cask
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN is not set; cask left unchanged."; exit 0; fi
          case "$TAG" in *-*) echo "Pre-release $TAG; cask left unchanged."; exit 0 ;; esac
          VERSION=${TAG#v}
          SHA=$(gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "Cluvia-$VERSION.dmg.sha256" -O - | cut -d' ' -f1)
          [ ${#SHA} -eq 64 ] || { echo "No checksum for $TAG"; exit 1; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Eliitme/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/cluvia.rb
          if git diff --quiet; then echo "Cask already at $VERSION."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "cluvia $VERSION"
          git push -q
