name: CI

# Pushes to main, and pull requests (development reaches main through one, so it is tested there once).
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces a run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          brew install xcodegen
          # The terminal renderer ships Metal shaders; Xcode 26 installs the Metal toolchain separately.
          xcodebuild -downloadComponent MetalToolchain
      - name: KubeKit unit tests
        working-directory: Packages/KubeKit
        run: swift test
      - name: HelmKit unit tests
        working-directory: Packages/HelmKit
        run: swift test
      - name: App build and tests
        run: |
          xcodegen generate
          xcodebuild test -project Cluvia.xcodeproj -scheme Cluvia -destination 'platform=macOS' \
            -skipPackagePluginValidation -derivedDataPath build/DerivedData
